<div class="navbar-spacer"></div>
<nav id="navbar" class="navbar">
  <div class="container navbar-main">
    <!-- Logo Group -->
    <span class="navbar-item navbar-logo-group">
      <a class="navbar-link" href="https://shop.mixxx.org" target="_blank">
        <img class="navbar-small-logo" src="{{ SITEURL }}/theme/images/t-shirt.png" alt="Mixxx T-Shirts">
      </a>
	  &nbsp;&nbsp;
      <a class="navbar-link" href="{{ SITEURL }}/news/2026-08-23-25_years_of_mixxx_dj_contest/" target="_self">
        <img class="navbar-small-logo" src="{{ SITEURL }}/theme/images/Medal25thAnniversarySilver.png" alt="25th Anniversary DJ Contest">
      </a>
	  &nbsp;&nbsp;
      <a class="navbar-link" href="{{ SITEURL }}/">
        <img class="navbar-main-logo" src="{{ SITEURL }}/theme/images/mixxx-logo.svg" alt="Mixxx">
      </a>
	  &nbsp;&nbsp;
    </span>
    <input class="navbar-hamburger-button" type="checkbox" id="navbar-hamburger-button" />
    <label class="navbar-hamburger-icon" for="navbar-hamburger-button"><span class="navicon"></span></label>
    <ul class="navbar-list navbar-hamburger-content">
      {% for item in NAV_MENU %}
      <li class="navbar-item{% if item.css %} {{ item.css }}{% endif %} {% if item.children %}has-dropdown{% endif %}">
        <a class="navbar-link" href="{{ item.url if '://' in item.url else SITEURL ~ item.url }}">{{ item.title|replace(" ", "&nbsp;") }}</a>
        {% if item.children %}
        <ul class="navbar-list navbar-dropdown">
          {% for child in item.children %}
          <li class="navbar-item{% if child.css %} {{ child.css }}{% endif %}">
            <a class="navbar-link" href="{{ child.url if '://' in child.url else SITEURL ~ child.url }}">{{ child.title|replace(" ", "&nbsp;") }}</a>
          </li>
          {% endfor %}
        </ul>
        {% endif %}
      </li>
      {% endfor %}
      <li class="navbar-item navbar-download-button">
        <span class="navbar-link">
          <a class="button button-primary" href="{{ SITEURL }}/download">{% trans %}Download{% endtrans %}</a>
        </span>
      </li>
    </ul>
  </div>
</nav>
